# 1. Основной сайт
server {
    listen 80;
    server_name sverahtin.com www.sverahtin.com;
    charset utf-8;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}

# 2. SonarQube
server {
    listen 80;
    server_name sonar.sverahtin.com;

    location / {
        proxy_pass http://sonarqube:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Nexus
server {
    listen 80;
    server_name nexus.sverahtin.com;

    # Увеличиваем лимит размера загружаемых файлов для артефактов Nexus
    client_max_body_size 1024M;

    location / {
        proxy_pass http://nexus:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 4. MinIO Console
server {
    listen 80;
    server_name minio.sverahtin.com;

    location / {
        proxy_pass http://minio:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Поддержка WebSocket (критично для интерфейса MinIO)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
