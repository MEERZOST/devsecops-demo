name: "DevSecOps CI CD Pipeline"

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SonarQube Code Analysis
        run: |
          docker run --rm \
            --network lab_work_back-net \
            -v ${{ github.workspace }}:/usr/src \
            sonarsource/sonar-scanner-cli \
            -Dsonar.host.url=http://sonarqube:9000 \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=Lab-Work-DevSecOps \
            -Dsonar.projectName="Lab Work DevSecOps" \
            -Dsonar.sources=. \
            -Dsonar.scanner.skipNodeProvisioning=true

      - name: Build Docker Image
        run: |
          docker build -f nginx/Dockerfile -t nexus.sverahtin.com:8081/lab-work-app:${{ github.sha }} -t nexus.sverahtin.com:8081/lab-work-app:latest .

      - name: Push Image to Nexus
        run: |
          docker push nexus.sverahtin.com:8081/lab-work-app:${{ github.sha }}
          docker push nexus.sverahtin.com:8081/lab-work-app:latest
